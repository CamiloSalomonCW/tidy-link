<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>TidyLink settings</title>
<style>
  :root { color-scheme: dark; font: 13px/1.45 system-ui, sans-serif; color: #f5f3f0; background: #222224; }
  * { box-sizing: border-box; }
  body { width: 310px; margin: 0; padding: 16px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .badge { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: #ff9a55; color: #261b14; }
  h1, h2, p { margin: 0; }
  h1 { font-size: 17px; }
  h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #ffab73; margin-bottom: 5px; }
  .muted, #jira-site { color: #c5c2c1; font-size: 12px; overflow-wrap: anywhere; }
  section { background: #2e2e31; border: 1px solid #464649; border-radius: 13px; padding: 10px 12px; margin-bottom: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 31px; }
  .row + .row { border-top: 1px solid #454548; }
  input[type=checkbox] { appearance: none; flex: none; width: 30px; height: 18px; margin: 0; border-radius: 20px; background: #555559; cursor: pointer; }
  input[type=checkbox]::before { content: ''; display: block; width: 12px; height: 12px; margin: 3px; border-radius: 50%; background: #fff; }
  input[type=checkbox]:checked { background: #ff9a55; }
  input[type=checkbox]:checked::before { transform: translateX(12px); background: #29201a; }
  button, input:not([type=checkbox]) { font: inherit; border-radius: 7px; }
  button { border: 0; padding: 5px 9px; font-weight: 650; color: #29201a; background: #ff9a55; cursor: pointer; }
  button.secondary { background: #464649; color: #f5f3f0; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid #ffab73; outline-offset: 3px; }
  .actions { display: flex; gap: 6px; margin-top: 7px; }
  .setup-actions { margin: 8px 0; }
  .setup-actions:not(:has(button:not([hidden]))) { display: none; }
  details { margin-top: 5px; color: #c5c2c1; }
  summary { cursor: pointer; }
  details label { display: block; margin-top: 6px; }
  input:not([type=checkbox]) { width: 100%; margin-top: 2px; padding: 5px 7px; border: 1px solid #57575b; background: #242426; color: #f5f3f0; }
  #status { color: #ffab73; font-size: 12px; }
  #status:empty { display: none; }
</style>
<header>
  <span class="badge" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 3h4v4m0-4-7 7m0-7H3v10h10v-3"/></svg></span>
  <div><h1>TidyLink</h1><p class="muted">GitHub &amp; Jira shortcuts</p></div>
</header>
<section>
  <h2>GitHub</h2>
  <label class="row">Copy PR title <input type="checkbox" role="switch" id="prTitle" disabled></label>
  <label class="row">Trunk merge queue <input type="checkbox" role="switch" id="trunk" disabled></label>
  <label class="row">Devin automation <input type="checkbox" role="switch" id="devin" disabled></label>
  <label class="row">Copy password and open Firm URL <input type="checkbox" role="switch" id="firm" disabled></label>
  <details>
    <summary>Firm URL setup</summary>
    <form id="firm-form">
      <label>GitHub repository <input id="firm-repo" placeholder="acme/demo" required></label>
      <label>Allowed domain <input id="firm-domain" placeholder="preview.example.com" required></label>
      <div class="actions"><button type="submit">Save</button></div>
    </form>
  </details>
</section>
<section>
  <h2>Jira</h2>
  <label class="row">Format issue link <input type="checkbox" role="switch" id="jira" disabled></label>
  <p id="jira-site">No site connected</p>
  <div class="actions">
    <button id="disconnect" class="secondary" disabled>Disconnect</button>
  </div>
</section>
<div class="actions setup-actions">
  <button id="connect" hidden disabled>This is Jira</button>
  <button id="detect-pr" hidden disabled>This is a PR</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script src="options.js"></script>
</html>
